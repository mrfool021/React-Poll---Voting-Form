name: poll-app

services:
  # --------------------------------------------------------------------------
  # db - MySQL 8.4 (Port 3306 mapped to host for VS Code / DB clients)
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pollsdb}
      MYSQL_USER: ${MYSQL_USER:-poll_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - poll-db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - poll-net
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # poll-api - Express REST API (production stage: non-root, health-checked)
  # --------------------------------------------------------------------------
  poll-api:
    build:
      context: ./poll-api
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-pollsdb}
      DB_USER: ${MYSQL_USER:-poll_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      VOTER_SALT: ${VOTER_SALT:?Set VOTER_SALT in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ENFORCE_ONE_VOTE: ${ENFORCE_ONE_VOTE:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - poll-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --------------------------------------------------------------------------
  # frontend - Vite build served by unprivileged Nginx
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_BUILD_NUMBER: ${BUILD_NUMBER:-local}
    restart: unless-stopped
    networks:
      - poll-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --------------------------------------------------------------------------
  # proxy - the single public entry point (host :8080 -> container :8080)
  # --------------------------------------------------------------------------
  proxy:
    build:
      context: ./proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      frontend:
        condition: service_healthy
      poll-api:
        condition: service_healthy
    networks:
      - poll-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # --------------------------------------------------------------------------
  # phpmyadmin - Database web UI available at http://localhost:8081
  # --------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: poll-app-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - poll-net

networks:
  poll-net:
    driver: bridge

volumes:
  poll-db-data:
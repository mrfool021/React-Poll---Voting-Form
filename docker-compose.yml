# ----------------------------------------------------------------------------
# PRODUCTION-SAFE BASE. Only the proxy publishes a port.
#
#   dev  :  docker compose up -d --build
#           (docker-compose.override.yml is merged automatically: DB port + phpMyAdmin,
#            both bound to 127.0.0.1)
#   prod :  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#           (skips the override file, adds HTTPS - see docker-compose.prod.yml)
# ----------------------------------------------------------------------------
name: poll-app

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --------------------------------------------------------------------------
  # db - MySQL 8.4 (reachable only from inside poll-net)
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pollsdb}
      MYSQL_USER: ${MYSQL_USER:-poll_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - poll-db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - poll-net
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # poll-api - Express REST API (production stage: non-root, health-checked)
  # --------------------------------------------------------------------------
  poll-api:
    build:
      context: ./poll-api
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-pollsdb}
      DB_USER: ${MYSQL_USER:-poll_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      VOTER_SALT: ${VOTER_SALT:?Set VOTER_SALT in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ENFORCE_ONE_VOTE: ${ENFORCE_ONE_VOTE:-true}
      POLL_IMAGE_MAX_BYTES: ${POLL_IMAGE_MAX_BYTES:-1572864}
      AVATAR_MAX_BYTES: ${AVATAR_MAX_BYTES:-262144}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - poll-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m

  # --------------------------------------------------------------------------
  # frontend - Vite build served by unprivileged Nginx
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_BUILD_NUMBER: ${BUILD_NUMBER:-local}
    restart: unless-stopped
    networks:
      - poll-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

  # --------------------------------------------------------------------------
  # proxy - the single public entry point
  # --------------------------------------------------------------------------
  proxy:
    build:
      context: ./proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      frontend:
        condition: service_healthy
      poll-api:
        condition: service_healthy
    networks:
      - poll-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

networks:
  poll-net:
    driver: bridge

volumes:
  poll-db-data:

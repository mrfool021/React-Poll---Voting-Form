# Reverse proxy - the ONLY service published to the host.
#   /        -> frontend  (static React build)
#   /api/    -> poll-api  (Express REST API, incl. base64 image uploads)
#   /health  -> poll-api  (health probe, handy for uptime monitors)
# PRODUCTION config: TLS on 8443 (host :443), HTTP on 8080 (host :80) only redirects.
# Replace example.com, and place fullchain.pem / privkey.pem in ./certs (see README).

upstream frontend_upstream {
    server frontend:8080;
    keepalive 8;
}

upstream api_upstream {
    server poll-api:3000;
    keepalive 16;
}

# Per-IP request throttle in front of the API (the API also rate-limits itself)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

# Plain HTTP: redirect everything to HTTPS (except the local health probe)
server {
    listen 8080;
    server_name example.com www.example.com;
    server_tokens off;

    location = /health {
        proxy_pass http://api_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Default for everything except /api/: tiny bodies only
    client_max_body_size 16k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Poll photos and avatars travel as base64 inside JSON (~1.4 MB max after
        # compression, base64 adds 33%). Keep >= the API's image body limit.
        client_max_body_size 3m;

        limit_req zone=api_zone burst=100 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location = /health {
        proxy_pass http://api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Reverse proxy - the ONLY service published to the host (port 8080).
#   /        -> frontend  (static React build)
#   /api/    -> poll-api  (Express REST API)
#   /health  -> poll-api  (health probe, handy for uptime monitors)

upstream frontend_upstream {
    server frontend:8080;
}

upstream api_upstream {
    server poll-api:3000;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Reject oversized request bodies early (API itself also caps at 10kb)
    client_max_body_size 16k;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location = /health {
        proxy_pass http://api_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

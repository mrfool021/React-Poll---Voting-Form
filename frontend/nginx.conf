# Static file server for the built React app (runs as non-root on port 8080)
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers (declared once at server level - do NOT add add_header inside
    # the location blocks below, that would silently drop these).
    # img-src: 'self' (the app), data: (avatar/photo previews), blob: (images fetched
    # with the login token), https: (users may use an external https avatar URL).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Vite file names contain a content hash -> safe to cache for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Never cache the entry page, so a new deployment is picked up immediately
    location = /index.html {
        expires -1;
    }

    # Not hashed: short cache
    location ~* ^/(theme-init\.js|favicon\.svg)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
